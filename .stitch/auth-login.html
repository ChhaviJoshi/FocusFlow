<div class="text-center mb-8">
<h1 class="text-3xl font-bold text-primary mb-2 tracking-tight">Welcome back</h1>
<p class="text-on-surface-variant font-medium">
                    Don't have an account? 
                    <a class="text-primary-container hover:underline font-bold ml-1 transition-colors" href="#">Sign Up</a>
</p>
</div>
<!-- Social Action -->
<div class="flex flex-col gap-4">
<button class="w-full h-14 flex items-center justify-center gap-3 bg-surface-container-low border border-outline-variant hover:bg-surface-variant transition-all rounded-xl text-primary font-bold text-base">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>

<path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-5.38z" fill="#EA4335"></path>
</svg>

                </button>
</div>
<!-- Divider -->
<div class="flex items-center my-8">
<div class="flex-grow h-px bg-outline-variant opacity-30"></div>
<span class="px-4 text-xs font-bold text-on-surface-variant tracking-widest">OR</span>
<div class="flex-grow h-px bg-outline-variant opacity-30"></div>
</div>
<!-- Login Form (Visible State) -->
<form class="space-y-6">
<div class="space-y-4">
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-primary ml-1" for="email">Email</label>
<input class="w-full h-14 px-4 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary transition-all placeholder:text-on-surface-variant placeholder:opacity-50 text-primary font-medium" id="email" placeholder="name@company.com" type="email"/>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center ml-1">
<label class="text-sm font-semibold text-primary" for="password">Password</label>
<a class="text-xs font-bold text-primary-container hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full h-14 px-4 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary transition-all placeholder:text-on-surface-variant placeholder:opacity-50 text-primary font-medium" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
<button class="w-full h-14 bg-primary text-on-primary font-bold rounded-xl hover:bg-primary-container transition-all text-base shadow-sm active:scale-[0.98]" type="submit">
                    Sign In
                </button>
</form>
